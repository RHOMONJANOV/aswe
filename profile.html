<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            padding: 0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: all 0.3s ease;
        }
        h2 {
            color: #333;
            font-size: 30px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        input[type="file"],
        input[type="text"],
        input[type="password"] {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 2px solid #ddd;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }
        input[type="file"]:focus,
        input[type="text"]:focus,
        input[type="password"]:focus {
            border: 2px solid #007bff;
        }
        .edit-btn {
            background-color: #007bff;
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .edit-btn:hover {
            background-color: #0056b3;
        }
        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 20px 0;
            border: 3px solid #007bff;
            transition: all 0.3s ease;
        }
        img:hover {
            transform: scale(1.1);
        }
        .logout-btn {
            background-color: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }
        .delete-btn {
            background-color: #d9534f;
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .delete-btn:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Welcome, <span id="userName"></span></h2>
    <input type="file" id="profilePic" accept="image/*">
    <img id="profileImage" style="display: none;">

    <div>
        <h3>Edit Profile</h3>
        <input type="text" id="editName" placeholder="Edit Name">
        <input type="password" id="editPassword" placeholder="Edit Password">
        <button class="edit-btn" onclick="saveChanges()">Save Changes</button>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
    <button class="delete-btn" onclick="deleteAccount()">Delete Account</button>
</div>

<script>
    let user = JSON.parse(localStorage.getItem('user'));
    if (!user || localStorage.getItem('loggedIn') !== 'true') {
        window.location.href = "index.html";
    }

    document.getElementById('userName').textContent = user.name;

    document.getElementById('profilePic').addEventListener('change', function(event) {
        let reader = new FileReader();
        reader.onload = function() {
            document.getElementById('profileImage').src = reader.result;
            document.getElementById('profileImage').style.display = 'block';
            localStorage.setItem('profilePic', reader.result);
        };
        reader.readAsDataURL(event.target.files[0]);
    });

    let savedPic = localStorage.getItem('profilePic');
    if (savedPic) {
        document.getElementById('profileImage').src = savedPic;
        document.getElementById('profileImage').style.display = 'block';
    }

    function saveChanges() {
        let editedName = document.getElementById('editName').value;
        let editedPassword = document.getElementById('editPassword').value;

        if (editedName) user.name = editedName;
        if (editedPassword) user.password = editedPassword;

        localStorage.setItem('user', JSON.stringify(user));

        alert('Changes saved!');
    }

    function logout() {
        localStorage.removeItem('loggedIn');
        window.location.href = "index.html";
    }

    function deleteAccount() {
        let confirmDelete = confirm("Are you sure you want to delete your account? This action cannot be undone!");

        if (confirmDelete) {
            localStorage.removeItem('user');
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('profilePic');
            alert("Your account has been deleted.");
            window.location.href = "index.html";
        }
    }
</script>

</body>
</html>
